# Supply-chain, license, and advisory policy for PARQONAUT (`cargo deny`).

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # chrono 0.4.45 marked unmaintained with no fixed replacement release; pervasive across sqlx/utoipa/schemars/public types.
    # Review by: 2027-03-01
    { id = "RUSTSEC-2026-0543", reason = "Unmaintained upstream with no patch release; public/DB schema migration deferred post-v1.0 (review by 2027-03-01)" },
    # unsafe-libyaml 0.2.11 (unmaintained via serde_yaml 0.9.34+deprecated, no security vulnerability); used only for operator-supplied --spec YAML files.
    # Review by: 2027-03-01
    { id = "RUSTSEC-2024-0449", reason = "Unmaintained notice only (no CVE); used solely to parse local operator transform YAML specs (review by 2027-03-01)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
