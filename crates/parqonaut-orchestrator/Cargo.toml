[package]
name = "parqonaut-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Multi-dataset batch orchestration: planning, scheduling, journal, and recovery"

[dependencies]
parqonaut-repair = { path = "../parqonaut-repair" }
parqonaut-storage = { path = "../parqonaut-storage" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
camino = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
sha2 = { workspace = true }
hex = { workspace = true }
toml = "0.8"
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal"] }
arrow = "54"
parquet = { version = "54", features = ["arrow"] }

[features]
default = ["s3"]
s3 = ["parqonaut-storage/s3", "parqonaut-repair/s3"]

[[bin]]
name = "generate-phase4-fixtures"
path = "src/bin/generate_phase4_fixtures.rs"

[dev-dependencies]
tempfile = "3"
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
parqonaut-storage = { path = "../parqonaut-storage" }
bytes = "1.9"
