[package]
name = "parqonaut-repair"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Evidence-driven Parquet dataset repair planning, execution, and verification"

[dependencies]
paraclete-core = { path = "../paraclete-core" }
paraclete-types = { path = "../paraclete-types" }
parqonaut-transform = { path = "../parqonaut-transform" }
parqonaut-storage = { path = "../parqonaut-storage" }
async-trait = "0.1"
bytes = "1.9"
url = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
sha2 = { workspace = true }
hex = { workspace = true }
camino = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
walkdir = "2.5"

[features]
default = []
s3 = ["parqonaut-storage/s3"]

[dev-dependencies]
tempfile = "3"
arrow = { workspace = true }
parquet = { workspace = true }
parqonaut-transform = { path = "../parqonaut-transform" }
parqonaut-storage = { path = "../parqonaut-storage" }

