[package]
name = "parqonaut-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Application service layer and HTTP API for PARQONAUT."

[features]
default = ["s3"]
s3 = ["parqonaut-app/s3"]

[dependencies]
parqonaut-types.workspace = true
parqonaut-core = { path = "../parqonaut-core" }
parqonaut-store = { path = "../parqonaut-store" }
parqonaut-app = { path = "../parqonaut-app" }
parqonaut-repair = { path = "../parqonaut-repair" }
parqonaut-orchestrator = { path = "../parqonaut-orchestrator" }
parqonaut-storage = { path = "../parqonaut-storage" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
camino.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tower-http.workspace = true
utoipa.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
futures-util = "0.3"
urlencoding.workspace = true

[dev-dependencies]
http-body-util.workspace = true
serial_test = "3.4.0"
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tower.workspace = true
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
urlencoding.workspace = true
