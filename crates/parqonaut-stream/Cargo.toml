[package]
name = "parqonaut-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Streaming CSV/Parquet conversion engine (maw lineage)"

[lib]
name = "parqonaut_stream"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
csv = "1.3"
encoding_rs = "0.8"
arrow = { workspace = true }
parquet = { workspace = true }
zstd = "0.13"
flate2 = "1.0"
snap = "1.0"
indicatif = "0.17"
human_bytes = "0.4"
humantime = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
globwalk = "0.8"
walkdir = "2.4"
rayon = "1.8"
crc64fast = "1.1.0"
parqonaut-workflow = { path = "../parqonaut-workflow" }
parqonaut-columnar = { path = "../parqonaut-columnar" }
futures = "0.3"
bytes = "1"
parqonaut-storage = { path = "../parqonaut-storage", optional = true, features = ["columnar"] }
sha2 = { workspace = true }
hex = { workspace = true }

[features]
default = []
storage = ["dep:parqonaut-storage", "parqonaut-storage/s3"]

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
insta = "1.0"
proptest = "1.0"
uuid = { version = "1.10", features = ["v4"] }
bytes = "1"
futures = "0.3"
parqonaut-storage = { path = "../parqonaut-storage", features = ["columnar", "s3"] }
