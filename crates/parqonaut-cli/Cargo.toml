[package]
name = "parqonaut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Unified PARQONAUT CLI — scan, transform, stream"

[[bin]]
name = "prqnt"
path = "src/main.rs"

[features]
default = ["s3"]
s3 = ["parqonaut-repair/s3", "parqonaut-storage/s3"]

[dependencies]
parqonaut-core = { path = "../parqonaut-core" }
parqonaut-types = { path = "../parqonaut-types" }
parqonaut-service = { path = "../parqonaut-service", features = ["s3"] }
parqonaut-store = { path = "../parqonaut-store" }
parqonaut-app = { path = "../parqonaut-app", features = ["s3"] }
parqonaut-plugin-host = { path = "../parqonaut-plugin-host" }
parqonaut-plugin-protocol = { workspace = true }
dirs = "6"
toml = "0.8"
url = "2"
parqonaut-transform = { path = "../parqonaut-transform", features = ["s3"] }
parqonaut-stream = { path = "../parqonaut-stream", features = ["storage"] }
parqonaut-repair = { path = "../parqonaut-repair" }
parqonaut-storage = { path = "../parqonaut-storage" }
parqonaut-orchestrator = { path = "../parqonaut-orchestrator" }
clap.workspace = true
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal"] }
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
tracing-subscriber.workspace = true
camino.workspace = true
serde_json.workspace = true
uuid.workspace = true
parquet = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"
parqonaut-orchestrator = { path = "../parqonaut-orchestrator" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
walkdir = "2.5"
arrow = { workspace = true }
parquet = { workspace = true }
