[package]
name = "parqonaut-transform"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors = ["parqknife contributors"]
description = "Parquet transformation engine (parqknife lineage)"

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
glob = "0.3"
thiserror = "1"
anyhow = "1"
url = "2.5"
futures = "0.3"
num_cpus = "1.16"
uuid = { version = "1.10", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indicatif = "0.17"
rayon = "1.8"
nom = "7.1"
parqonaut-workflow = { path = "../parqonaut-workflow" }
parqonaut-columnar = { path = "../parqonaut-columnar" }
parqonaut-storage = { path = "../parqonaut-storage", features = ["columnar"] }

[features]
default = []
s3 = ["parqonaut-storage/s3"]

[dev-dependencies]
tempfile = "3.10"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.10", features = ["v4"] }
parqonaut-stream = { path = "../parqonaut-stream", features = ["storage"] }
futures = "0.3"
arrow = { workspace = true }
parquet = { workspace = true }
