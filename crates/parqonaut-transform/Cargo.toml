[package]
name = "parqonaut-transform"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors = ["parqknife contributors"]
description = "Parquet transformation engine (parqknife lineage)"

[dependencies]
arrow = { version = "54", features = [] }
parquet = { version = "54", features = ["arrow"] }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
glob = "0.3"
thiserror = "1"
anyhow = "1"
url = "2.5"
futures = "0.3"
num_cpus = "1.16"
uuid = { version = "1.10", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indicatif = "0.17"
rayon = "1.8"
nom = "7.1"

[dev-dependencies]
tempfile = "3.10"
