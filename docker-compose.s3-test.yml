# FOGBANK — Phase 5 S3-compatible laboratory (RustFS 1.0.0, pinned digest).
#
# API: http://127.0.0.1:9000
# Start: scripts/s3-test/up.sh
# Stop:  scripts/s3-test/down.sh

services:
  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:ba0a1b53e36f321c0d46f3867104abef169f7bc59c467c664ddac87e7ddc9a8b
    container_name: parqonaut-phase5-rustfs
    ports:
      - "9000:9000"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs-phase5-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rustfs-phase5-data:
    name: parqonaut-phase5-rustfs-data
