[package]
name = "parqonaut-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arrow = { version = "60.1.0", default-features = false, features = ["ipc"] }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "lz4", "zstd"] }
bytes = "1"
serde_json = "1"
toml = "0.8"

parqonaut-client = { path = "../crates/parqonaut-client" }
parqonaut-core = { path = "../crates/parqonaut-core" }
parqonaut-orchestrator = { path = "../crates/parqonaut-orchestrator" }
parqonaut-plugin-host = { path = "../crates/parqonaut-plugin-host" }
parqonaut-plugin-protocol = { path = "../crates/parqonaut-plugin-protocol" }
parqonaut-repair = { path = "../crates/parqonaut-repair" }
parqonaut-service = { path = "../crates/parqonaut-service" }
parqonaut-storage = { path = "../crates/parqonaut-storage" }

[[bin]]
name = "fuzz_parquet_metadata"
path = "fuzz_targets/fuzz_parquet_metadata.rs"
test = false
doc = false

[[bin]]
name = "fuzz_arrow_ipc"
path = "fuzz_targets/fuzz_arrow_ipc.rs"
test = false
doc = false

[[bin]]
name = "fuzz_plugin_protocol"
path = "fuzz_targets/fuzz_plugin_protocol.rs"
test = false
doc = false

[[bin]]
name = "fuzz_http_json"
path = "fuzz_targets/fuzz_http_json.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sse_stream"
path = "fuzz_targets/fuzz_sse_stream.rs"
test = false
doc = false

[[bin]]
name = "fuzz_dataset_uri"
path = "fuzz_targets/fuzz_dataset_uri.rs"
test = false
doc = false

[[bin]]
name = "fuzz_repair_plan"
path = "fuzz_targets/fuzz_repair_plan.rs"
test = false
doc = false

[[bin]]
name = "fuzz_batch_config"
path = "fuzz_targets/fuzz_batch_config.rs"
test = false
doc = false

[[bin]]
name = "fuzz_schema_compat"
path = "fuzz_targets/fuzz_schema_compat.rs"
test = false
doc = false
