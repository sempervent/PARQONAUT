name: Plugin integration

on:
  push:
    branches: [main, feat/plugin-execution]
  pull_request:
    branches: [main]

env:
  CARGO_BUILD_JOBS: 2

jobs:
  plugin-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: extractions/setup-just@v2
      - name: Python plugin SDK
        working-directory: python/parqonaut_plugins
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run python -m pytest
      - name: Rust plugin and server gates
        env:
          PARQONAUT_PLUGIN_ROOTS: ${{ github.workspace }}/fixtures/plugins
          PARQONAUT_PLUGIN_SDK_PATH: ${{ github.workspace }}/python/parqonaut_plugins/src
          PARQONAUT_PLUGIN_PYTHON: python3
        run: |
          just plugin-test
          cargo test -p parqonaut-service --test server_plugin_policy --test server_plugin_durable -- --test-threads=1
