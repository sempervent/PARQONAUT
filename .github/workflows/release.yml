name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag / version (e.g. v0.12.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  build-artifacts:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (--locked)
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p parqonaut-cli --bin prqnt
      - name: Package archive & clean-environment smoke test
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          fi
          STAGE="dist/parqonaut-${VER}-${{ matrix.target }}"
          mkdir -p "${STAGE}" dist
          cp "target/${{ matrix.target }}/release/prqnt" "${STAGE}/prqnt"
          cp LICENSE README.md CHANGELOG.md "${STAGE}/"
          cat > "${STAGE}/BUILD_METADATA.json" <<EOF
          {
            "version": "${VER}",
            "target": "${{ matrix.target }}",
            "git_sha": "${GITHUB_SHA}",
            "locked": true
          }
          EOF
          ARCHIVE="parqonaut-${VER}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" "parqonaut-${VER}-${{ matrix.target }}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            fi
          )

          # Clean-environment verification in an isolated directory without cargo/node/repo env.
          CLEAN_DIR="$(mktemp -d)"
          tar -C "${CLEAN_DIR}" -xzf "dist/${ARCHIVE}"
          BIN="${CLEAN_DIR}/parqonaut-${VER}-${{ matrix.target }}/prqnt"
          "${BIN}" --version
          "${BIN}" --help >/dev/null
          "${BIN}" plugin list
          "${BIN}" tui --help >/dev/null
          "${BIN}" serve --print-openapi >/dev/null
          printf "id,region,val\n1,us,10\n2,eu,20\n" > "${CLEAN_DIR}/in.csv"
          "${BIN}" convert "${CLEAN_DIR}/in.csv" -o "${CLEAN_DIR}/out.parquet"
          "${BIN}" --json scan "${CLEAN_DIR}/out.parquet" >/dev/null
          rm -rf "${CLEAN_DIR}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/parqonaut-*.tar.gz
            dist/parqonaut-*.tar.gz.sha256

  package-sbom-and-release:
    name: Assemble Release & Attestations
    needs: build-artifacts
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate Cargo metadata SBOM & combined SHA256SUMS
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > dist/cargo-metadata-sbom.json
          (
            cd dist
            cat *.sha256 > SHA256SUMS
            sha256sum cargo-metadata-sbom.json >> SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish draft GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/cargo-metadata-sbom.json
