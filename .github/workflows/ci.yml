name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_BUILD_JOBS: 2
  # RustFS 1.0.0 — official GHCR image, linux/amd64 digest pinned for reproducible CI.
  RUSTFS_IMAGE: ghcr.io/rustfs/rustfs:1.0.0
  RUSTFS_IMAGE_DIGEST: sha256:ba0a1b53e36f321c0d46f3867104abef169f7bc59c467c664ddac87e7ddc9a8b

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: naming check
        run: scripts/check-active-naming.sh
      - name: test
        run: |
          cargo xtask fixtures repair
          cargo test --workspace

  api-integration:
    name: API integration (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: API tests and smoke
        run: |
          set -euo pipefail
          cargo build -p parqonaut-cli --bin prqnt
          cargo test -p paraclete-service --tests
          cargo test -p paraclete-store --test auth_tokens
          bash scripts/api-test/smoke.sh --start

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    env:
      PARACLETE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/paraclete_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paraclete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paraclete_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Store and job tests (Postgres)
        run: |
          cargo test -p paraclete-store --test postgres_store_integration -- --ignored --test-threads=1
      - name: HTTP API smoke (Postgres)
        run: |
          cargo test -p paraclete-service --test http_api_postgres -- --ignored

  s3-integration:
    name: S3 integration (RustFS)
    runs-on: ubuntu-latest
    env:
      PARQONAUT_S3_INTEGRATION: "1"
      PARQONAUT_S3_ENDPOINT: http://127.0.0.1:9000
      PARQONAUT_S3_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start RustFS (S3-compatible integration backend)
        run: |
          docker pull "${RUSTFS_IMAGE}@${RUSTFS_IMAGE_DIGEST}"
          docker rm -f parqonaut-rustfs || true
          docker volume create parqonaut-rustfs-ci-data
          docker run -d \
            --name parqonaut-rustfs \
            -p 9000:9000 \
            -v parqonaut-rustfs-ci-data:/data \
            -e RUSTFS_VOLUMES=/data \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            -e RUSTFS_CONSOLE_ENABLE=false \
            -e RUSTFS_ACCESS_KEY=rustfsadmin \
            -e RUSTFS_SECRET_KEY=rustfsadmin \
            -e RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true \
            "${RUSTFS_IMAGE}@${RUSTFS_IMAGE_DIGEST}"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health/ready; then
              echo "RustFS ready"
              break
            fi
            if [ "$i" = 60 ]; then
              docker logs parqonaut-rustfs
              exit 1
            fi
            sleep 2
          done
      - name: Install AWS CLI
        run: pip install awscli
      - name: S3 smoke test
        run: bash scripts/s3-test/s3-smoke.sh
      - name: FOGBANK fixtures upload
        run: |
          aws --endpoint-url "$PARQONAUT_S3_ENDPOINT" s3 mb "s3://fogbank" || true
          aws --endpoint-url "$PARQONAUT_S3_ENDPOINT" s3 mb "s3://parqonaut-test" || true
          aws --endpoint-url "$PARQONAUT_S3_ENDPOINT" s3 mb "s3://contract-test" || true
          bash scripts/s3-test/fixtures.sh
      - name: Object storage integration tests
        run: |
          cargo test -p parqonaut-storage --features "s3,fogbank-fixtures,test-util" -- --nocapture
          cargo test -p parqonaut-transform --features s3 --test remote_matrix_s3 -- --nocapture
