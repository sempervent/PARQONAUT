schema_version = 1

[batch]
name = "phase5-mixed-fleet"
max_concurrency = 3
output_root = "s3://fogbank/phase5-batch/"
run_root = "../../target/phase5-batch-journal"

[[datasets]]
id = "local-to-local"
path = "local/healthy"
output = "../../target/phase5-batch/local-local/"

[[datasets]]
id = "local-to-s3"
path = "local/healthy"

[[datasets]]
id = "s3-to-local"
path = "s3://fogbank/datasets/healthy/"
output = "../../target/phase5-batch/s3-local/"

[[datasets]]
id = "s3-to-s3"
path = "s3://fogbank/datasets/healthy/"

[[datasets]]
id = "bad-remote"
path = "s3://fogbank/datasets/does-not-exist/"
