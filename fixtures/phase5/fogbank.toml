# FOGBANK scenario catalog (Phase 5 object-storage laboratory)

[bucket]
name = "fogbank"
prefix = "datasets"

[[scenarios]]
id = "healthy"
uri = "s3://fogbank/datasets/healthy/"
description = "Multi-file healthy remote dataset for inventory and fingerprint smoke tests."
objects = ["events-001.parquet", "events-002.parquet"]

[[scenarios]]
id = "large-parquet"
uri = "s3://fogbank/datasets/large-parquet/"
description = "Single large Parquet object for ranged footer reads and streaming."
objects = ["wide-table.parquet"]
min_size_bytes = 1_000_000

[[scenarios]]
id = "stale-source"
uri = "s3://fogbank/datasets/stale-source/"
description = "Baseline snapshots for stale-plan / fingerprint drift tests."
objects = ["snapshot-00.parquet", "snapshot-01.parquet", "snapshot-02.parquet"]
mutation = "local/stale-source/MUTATION.md"

[minio]
endpoint = "http://127.0.0.1:9000"
console = "http://127.0.0.1:9001"
access_key = "minioadmin"
secret_key = "minioadmin"
