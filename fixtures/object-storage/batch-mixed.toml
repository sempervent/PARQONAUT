schema_version = 1

[batch]
name = "mixed-storage-fleet"
max_concurrency = 3
output_root = "s3://fogbank/mixed-storage-batch/"
run_root = "../../target/mixed-storage-batch-journal"

[[datasets]]
id = "local-to-local"
path = "local/healthy"
output = "../../target/mixed-storage-batch/local-local/"

[[datasets]]
id = "local-to-s3"
path = "local/stale-source"

[[datasets]]
id = "s3-to-local"
path = "s3://fogbank/datasets/healthy/"
output = "../../target/mixed-storage-batch/s3-local/"

[[datasets]]
id = "s3-to-s3"
path = "s3://fogbank/datasets/stale-source/"

[[datasets]]
id = "bad-remote"
path = "s3://fogbank/datasets/does-not-exist/"
