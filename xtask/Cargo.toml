[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "PARQONAUT repository developer automation (fixtures, golden plans)"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
camino = { workspace = true }
paraclete-service = { path = "../crates/paraclete-service" }
parqonaut-repair = { path = "../crates/parqonaut-repair" }
parqonaut-orchestrator = { path = "../crates/parqonaut-orchestrator" }
parqonaut-storage = { path = "../crates/parqonaut-storage", features = ["s3", "fogbank-fixtures"] }
bytes = "1.9"
arrow = "54"
parquet = { version = "54", features = ["arrow"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
